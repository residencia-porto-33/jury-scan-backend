services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: juryscan
      POSTGRES_PASSWORD: juryscan
      POSTGRES_DB: juryscan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juryscan"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://juryscan:juryscan@db:5432/juryscan
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
